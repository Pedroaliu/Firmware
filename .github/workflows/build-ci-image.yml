name: Build Jixia CI image

on:
  workflow_dispatch:

  push:
    branches:
      - agent/ci-hermetic-toolchain
    paths:
      - ci/jixia-ci.Dockerfile
      - .github/workflows/build-ci-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: jixia-ci-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish RV64 QEMU image
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image_name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jixia-ci"
          echo "name=${image_name}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" |
            docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build image
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          docker build --pull \
            --file ci/jixia-ci.Dockerfile \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${IMAGE_NAME}:${GITHUB_SHA}" \
            .

      - name: Publish immutable image
        id: publish
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          image_digest="$(
            docker inspect \
              --format='{{index .RepoDigests 0}}' \
              "${IMAGE_NAME}:${GITHUB_SHA}"
          )"
          test -n "${image_digest}"
          echo "image=${image_digest}" >> "${GITHUB_OUTPUT}"
          printf '### Published CI image\n\n`%s`\n' "${image_digest}" >> "${GITHUB_STEP_SUMMARY}"
          echo "published image: ${image_digest}"
