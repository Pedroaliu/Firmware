name: Jixia CI

on:
  push:
    branches:
      - main
      - "milestone/**"
      - "feature/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: jixia-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Patch scope and hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      format_base: ${{ steps.scope.outputs.format_base }}
      full_ci: ${{ steps.scope.outputs.full_ci }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine validation scope
        id: scope
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            format_base="${PR_BASE_SHA}"
            scope_base="${PR_BASE_SHA}"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            format_base="$(git rev-parse HEAD^)"
            scope_base="${EVENT_BEFORE}"
          else
            git fetch origin main:refs/remotes/origin/main
            format_base="$(git merge-base HEAD origin/main)"
            scope_base="${EVENT_BEFORE}"
          fi

          if [[ -z "${scope_base}" || "${scope_base}" =~ ^0+$ ]]; then
            scope_base="${format_base}"
          fi

          mapfile -t changed_files < <(
            git diff --name-only "${scope_base}" HEAD
          )

          full_ci=true
          if [[ "${EVENT_NAME}" != "workflow_dispatch" &&
                ${#changed_files[@]} -gt 0 ]]; then
            full_ci=false
            for path in "${changed_files[@]}"; do
              if [[ "${path}" != docs/research/*.md ]]; then
                full_ci=true
                break
              fi
            done
          fi

          echo "scope base: ${scope_base}"
          echo "format base: ${format_base}"
          printf 'changed: %s\n' "${changed_files[@]}"
          echo "full CI: ${full_ci}"

          echo "format_base=${format_base}" >> "${GITHUB_OUTPUT}"
          echo "full_ci=${full_ci}" >> "${GITHUB_OUTPUT}"

      - name: Check patch hygiene
        shell: bash
        env:
          FORMAT_BASE: ${{ steps.scope.outputs.format_base }}
        run: |
          set -euo pipefail
          git diff --check "${FORMAT_BASE}" HEAD

      - name: Check C/C++ formatting
        if: ${{ steps.scope.outputs.full_ci == 'true' }}
        shell: bash
        env:
          FORMAT_BASE: ${{ steps.scope.outputs.format_base }}
        run: |
          bash scripts/check-format.sh --base "${FORMAT_BASE}"

  full-regression:
    name: RV64 QEMU full regression
    needs: scope
    if: ${{ needs.scope.outputs.full_ci == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    container:
      image: ghcr.io/pedroaliu/jixia-ci@sha256:2bfeddaeaa8d44afd60c6e6efce976dd3e32d10cc11eb3b4113d92f364a2ab5c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash

    env:
      JIXIA_QEMU_TIMEOUT_SECONDS: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify development environment
        run: |
          bash scripts/setup-dev-env.sh --check --without-gdb

      - name: Show resolved toolchain
        run: |
          bash scripts/jixia.sh env

      - name: Configure and build
        run: |
          bash scripts/jixia.sh build --reconfigure

      - name: TrapFrame regression
        run: |
          bash scripts/test-trap-frame.sh

      - name: Recoverable trap regression
        run: |
          bash scripts/test-recoverable-trap.sh

      - name: Machine timer regression
        run: |
          bash scripts/test-timer-interrupt.sh

      - name: Kernel print regression
        run: |
          bash scripts/test-kernel-print.sh

      - name: SMP population regression
        run: |
          bash scripts/test-m00-05-population.sh

      - name: M00-06.02 supervisor transition
        run: |
          bash scripts/test-m00-06-02-supervisor-transition.sh

      - name: M00-06.03 supervisor ECALL round trip
        run: |
          bash scripts/test-m00-06-03-supervisor-transition.sh

      - name: M00-06.04 hostile lower-privilege boundary
        run: |
          bash scripts/test-m00-06-04-privilege-boundary.sh

      - name: M00-07.01 pflash Stage0 to resident Base
        run: |
          bash scripts/test-m00-07-01-pflash-stage0.sh

      - name: M00-07.02 explicit contained EarlyMemory state
        run: |
          bash scripts/test-m00-07-02-contained-memory.sh

      - name: M00-07.03 pre-DDR flash-backed paging
        run: |
          bash scripts/test-m00-07-03-pre-ddr-paging.sh

      - name: M00-07.04 fake DDR and mainstore transition
        run: |
          bash scripts/test-m00-07-04-mainstore-transition.sh

      - name: M00-08.01 Hostboot-shaped task lifecycle
        run: |
          bash scripts/test-m00-08-01-task-lifecycle.sh

      - name: M00-08.02 Hostboot-shaped preemptive scheduler
        run: |
          JIXIA_QEMU_TIMEOUT_SECONDS=10 \
            bash scripts/test-m00-08-02-preemptive-scheduler.sh

      - name: M00-08.03.01 non-blocking IPC
        run: |
          JIXIA_QEMU_TIMEOUT_SECONDS=10 \
            bash scripts/test-m00-08-03-01-ipc-nonblocking.sh

      - name: M00-08.03.02 blocking IPC
        run: |
          JIXIA_QEMU_TIMEOUT_SECONDS=15 \
            bash scripts/test-m00-08-03-02-ipc-blocking-recv.sh

      - name: Upload firmware and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jixia-ci-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/clion-debug/jixia.elf
            build/clion-debug/jixia.bin
            build/clion-debug/jixia.map
            build/clion-debug/jixia.dis
            build/clion-debug/jixia.readelf
            build/clion-debug/*.log
            build/clion-debug/logs/
            build/m00-06-02/
            build/m00-06-03/
            build/m00-06-04/
            build/m00-07-01/
            build/m00-07-02/
            build/m00-07-03/
            build/m00-07-04/
            build/m00-08-01/
            build/m00-08-02/
            build/m00-08-03-01/
            build/m00-08-03-02/

  required:
    name: RV64 QEMU regression
    needs:
      - scope
      - full-regression
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Verify required validation
        shell: bash
        env:
          FULL_CI: ${{ needs.scope.outputs.full_ci }}
          FULL_RESULT: ${{ needs.full-regression.result }}
          SCOPE_RESULT: ${{ needs.scope.result }}
        run: |
          set -euo pipefail

          if [[ "${SCOPE_RESULT}" != "success" ]]; then
            echo "patch scope or hygiene failed: ${SCOPE_RESULT}" >&2
            exit 1
          fi

          if [[ "${FULL_CI}" == "true" &&
                "${FULL_RESULT}" != "success" ]]; then
            echo "full regression failed: ${FULL_RESULT}" >&2
            exit 1
          fi

          if [[ "${FULL_CI}" == "false" &&
                "${FULL_RESULT}" != "skipped" ]]; then
            echo "research-only fast path expected a skipped full regression" >&2
            exit 1
          fi

          echo "required validation passed"
